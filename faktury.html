<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Faktury za úklidy</title>
    <meta name="theme-color" content="#eef2f0">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <style>
        @font-face {
            font-family: 'Manrope';
            font-style: normal;
            font-display: swap;
            font-weight: 200 800;
            src: url('fonts/manrope-latin-ext-wght-normal.woff2') format('woff2-variations');
            unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
        }
        @font-face {
            font-family: 'Manrope';
            font-style: normal;
            font-display: swap;
            font-weight: 200 800;
            src: url('fonts/manrope-latin-wght-normal.woff2') format('woff2-variations');
            unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
        }

        :root {
            --bg: #eef2f0;
            --surface: #ffffff;
            --surface-2: #f5f7f6;
            --text: #17201d;
            --muted: #56625d;
            --accent: #0f766e;
            --accent-soft: #dff1ee;
            --gold: #a15c07;
            --green: #157f3d;
            --red: #b42318;
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { -webkit-text-size-adjust: 100%; }

        body {
            font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 16px;
            line-height: 1.5;
            min-height: 100vh;
        }

        .wrap { max-width: 860px; margin: 0 auto; padding: 22px 16px 40px; }

        h1 { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
        .lead { color: var(--muted); margin-top: 4px; }

        .summary {
            margin-top: 18px;
            background: var(--surface);
            border-radius: var(--radius);
            padding: 18px 20px;
        }

        .summary-label { color: var(--muted); font-weight: 600; }
        .summary-value { font-size: 2.3rem; font-weight: 800; color: var(--gold); line-height: 1.15; letter-spacing: -0.02em; }
        .summary-sub { color: var(--muted); }

        .section-title { font-size: 1.15rem; font-weight: 800; margin: 26px 4px 10px; }
        .section-count { color: var(--muted); font-weight: 600; font-size: 0.95rem; }

        .inv {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            text-align: left;
            position: relative;
            background: var(--surface);
            border: none;
            border-radius: var(--radius);
            padding: 16px 16px 16px 22px;
            margin-bottom: 10px;
            font-family: inherit;
            color: inherit;
            cursor: pointer;
            overflow: hidden;
        }

        .inv::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--gold); }
        .inv.paid { background: var(--surface-2); }
        .inv.paid::before { background: var(--green); }
        .inv .grow { flex: 1; min-width: 0; }
        .inv-number { font-weight: 800; font-size: 1.05rem; }
        .inv-sub { color: var(--muted); font-size: 0.92rem; }
        .inv-status { font-size: 0.9rem; font-weight: 700; color: var(--gold); }
        .inv.paid .inv-status { color: var(--green); }
        .inv-total { font-weight: 800; font-size: 1.2rem; white-space: nowrap; }

        .message {
            margin-top: 18px;
            background: var(--surface);
            border-radius: var(--radius);
            padding: 22px 20px;
            color: var(--muted);
        }

        .message strong { display: block; color: var(--text); font-size: 1.1rem; margin-bottom: 4px; }
        .message.error strong { color: var(--red); }

        /* ---------- Detail faktury ---------- */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-bottom: 14px;
        }

        .toolbar .spacer { flex: 1; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 46px;
            padding: 0 18px;
            border: none;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            font-family: inherit;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
        }

        .btn-primary { background: var(--accent); color: #fff; }
        .btn-plain { background: transparent; color: var(--text); padding: 0 8px; }
        .btn:disabled { opacity: 0.6; }

        .paid-banner {
            background: #e3f4e8;
            color: var(--green);
            font-weight: 800;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 14px;
        }

        .doc {
            background: #fff;
            border-radius: 6px;
            padding: 36px 34px;
            color: #111;
            font-size: 14px;
            line-height: 1.45;
        }

        .doc-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            padding-bottom: 18px;
            border-bottom: 2px solid #111;
        }

        .doc-title { font-size: 26px; font-weight: 800; letter-spacing: 0.02em; }
        .doc-number { font-size: 16px; font-weight: 700; text-align: right; }
        .doc-number span { display: block; font-size: 12px; font-weight: 600; color: #555; }

        .parties {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            padding: 20px 0;
        }

        .party-label { font-size: 12px; font-weight: 700; color: #555; margin-bottom: 4px; }
        .party-name { font-weight: 800; font-size: 15px; }
        .party-line { white-space: pre-line; }

        .facts {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px 24px;
            padding: 14px 0;
            border-top: 1px solid #ddd;
            border-bottom: 1px solid #ddd;
        }

        .fact-label { font-size: 12px; color: #555; }
        .fact-value { font-weight: 700; overflow-wrap: anywhere; }

        table { width: 100%; border-collapse: collapse; margin-top: 18px; }
        th { text-align: left; font-size: 12px; color: #555; font-weight: 700; padding: 6px 6px; border-bottom: 1px solid #111; }
        td { padding: 8px 6px; border-bottom: 1px solid #e5e5e5; vertical-align: top; }
        th.num, td.num { text-align: right; white-space: nowrap; }

        .totals {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-top: 22px;
        }

        .qr { text-align: center; font-size: 11px; color: #555; }
        .qr svg { width: 132px; height: 132px; display: block; margin: 0 auto 4px; }

        .grand { text-align: right; margin-left: auto; }
        .grand-label { font-size: 13px; color: #555; }
        .grand-value { font-size: 26px; font-weight: 800; }

        .doc-foot { margin-top: 26px; font-size: 12px; color: #555; }

        @media (max-width: 560px) {
            .doc { padding: 22px 16px; font-size: 13px; }
            .parties { grid-template-columns: 1fr; gap: 14px; }
            .facts { grid-template-columns: 1fr 1fr; }
            .doc-title { font-size: 21px; }
            .totals { flex-direction: column-reverse; align-items: stretch; }
            .grand { margin-left: 0; }
            td.hide-sm, th.hide-sm { display: none; }
        }

        @media print {
            @page { size: A4; margin: 14mm; }
            body { background: #fff; }
            .wrap { padding: 0; max-width: none; }
            .no-print { display: none !important; }
            .doc { padding: 0; border-radius: 0; font-size: 12.5px; }
            .parties { grid-template-columns: 1fr 1fr !important; }
            .facts { grid-template-columns: repeat(3, 1fr) !important; }
            .totals { flex-direction: row !important; align-items: flex-end !important; }
            td.hide-sm, th.hide-sm { display: table-cell !important; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div id="listView">
            <h1>Faktury za úklidy</h1>
            <div class="lead" id="lead">Načítám…</div>
            <div id="listBody"></div>
        </div>

        <div id="detailView" style="display:none">
            <div class="toolbar no-print">
                <button class="btn btn-plain" id="btnBack">← Všechny faktury</button>
                <span class="spacer"></span>
                <button class="btn" id="btnPrint">Uložit PDF / Tisk</button>
                <button class="btn btn-primary" id="btnPaid">Označit jako zaplacené</button>
            </div>
            <div class="paid-banner no-print" id="paidBanner" style="display:none"></div>
            <div class="doc" id="doc"></div>
            <p class="lead no-print" style="margin-top:12px;font-size:0.9rem">PDF: v okně tisku vyber „Uložit jako PDF“.</p>
        </div>
    </div>

    <script src="lib/qrcode.js"></script>
    <script>
        const DB_URL = 'https://evidence-uklidu-default-rtdb.europe-west1.firebasedatabase.app';
        let key = '';
        let invoices = [];

        function esc(v) {
            return String(v == null ? '' : v)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function params() {
            const h = new URLSearchParams(location.hash.slice(1));
            return {k: h.get('k') || '', f: h.get('f') || ''};
        }

        function parseLocalDate(s) {
            const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || '');
            return m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(s);
        }

        const d = s => s ? parseLocalDate(s).toLocaleDateString('cs-CZ') : '–';
        const kc = v => Number(v || 0).toLocaleString('cs-CZ') + ' Kč';
        const kc2 = v => Number(v || 0).toLocaleString('cs-CZ', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' Kč';

        function pocet(n) {
            return n + (n === 1 ? ' úklid' : (n >= 2 && n <= 4) ? ' úklidy' : ' úklidů');
        }

        function duration(min) {
            if (!min) return '';
            const h = Math.floor(min / 60), m = min % 60;
            return h ? (h + ' h' + (m ? ' ' + m + ' min' : '')) : m + ' min';
        }

        function period(items) {
            const ds = (items || []).map(i => i.date).filter(Boolean).sort();
            if (!ds.length) return '';
            const a = parseLocalDate(ds[0]), b = parseLocalDate(ds[ds.length - 1]);
            const f = x => x.getDate() + '. ' + (x.getMonth() + 1) + '.';
            return ds[0] === ds[ds.length - 1] ? f(a) + ' ' + a.getFullYear() : f(a) + ' – ' + f(b) + ' ' + b.getFullYear();
        }

        function docTitle(inv) {
            return inv.supplier && inv.supplier.ico ? 'Faktura' : 'Vyúčtování';
        }

        // ---------- QR platba ----------
        function mod97(numStr) {
            let r = 0;
            for (const ch of numStr) r = (r * 10 + (+ch)) % 97;
            return r;
        }

        function toIBAN(account) {
            const s = String(account || '').replace(/\s+/g, '').toUpperCase();
            if (/^CZ\d{22}$/.test(s)) return s;
            const m = /^(?:(\d{1,6})-)?(\d{2,10})\/(\d{4})$/.exec(s);
            if (!m) return null;
            const bban = m[3] + (m[1] || '').padStart(6, '0') + m[2].padStart(10, '0');
            const check = 98 - mod97(bban + '123500'); // C=12, Z=35, 00
            return 'CZ' + String(check).padStart(2, '0') + bban;
        }

        function ascii(s) {
            return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\x20-\x7E]/g, '').replace(/\*/g, '');
        }

        function qrSvg(inv, vs) {
            const iban = toIBAN(inv.supplier && inv.supplier.account);
            if (!iban || typeof qrcode !== 'function') return '';
            const spd = 'SPD*1.0*ACC:' + iban + '*AM:' + Number(inv.total || 0).toFixed(2) + '*CC:CZK' +
                (inv.dueDate ? '*DT:' + inv.dueDate.replace(/-/g, '') : '') +
                '*X-VS:' + vs + '*MSG:' + ascii(docTitle(inv) + ' ' + inv.number).slice(0, 60);
            const q = qrcode(0, 'M');
            q.addData(spd);
            q.make();
            return q.createSvgTag({cellSize: 4, margin: 2, scalable: true});
        }

        // ---------- data ----------
        async function db(method, path, body) {
            const res = await fetch(DB_URL + '/' + path + '.json', {
                method,
                headers: body !== undefined ? {'Content-Type': 'application/json'} : undefined,
                body: body !== undefined ? JSON.stringify(body) : undefined
            });
            if (!res.ok) { const e = new Error('HTTP ' + res.status); e.status = res.status; throw e; }
            return res.json();
        }

        async function load() {
            key = params().k;
            const lead = document.getElementById('lead');
            const body = document.getElementById('listBody');
            if (!key || key.length < 20) {
                lead.textContent = '';
                body.innerHTML = '<div class="message error"><strong>Neplatný odkaz</strong>Požádej o nový odkaz z aplikace Moje úklidy.</div>';
                return;
            }
            try {
                const data = await db('GET', 'faktury/' + encodeURIComponent(key));
                invoices = data && typeof data === 'object' ? Object.values(data).filter(x => x && x.id) : [];
                invoices.sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
            } catch (e) {
                lead.textContent = '';
                body.innerHTML = '<div class="message error"><strong>Faktury se nepodařilo načíst</strong>' +
                    (e.status === 401 || e.status === 403 ? 'Online úložiště odmítlo přístup.' : 'Zkontroluj připojení k internetu a obnov stránku.') + '</div>';
                return;
            }
            route();
        }

        function renderList() {
            document.getElementById('listView').style.display = '';
            document.getElementById('detailView').style.display = 'none';
            document.title = 'Faktury za úklidy';
            const lead = document.getElementById('lead');
            const body = document.getElementById('listBody');
            const first = invoices[0];
            lead.textContent = first && first.supplier ? 'Od: ' + first.supplier.name : '';
            if (!invoices.length) {
                body.innerHTML = '<div class="message"><strong>Zatím žádné faktury</strong>Jakmile nějakou vystaví, objeví se tady.</div>';
                return;
            }
            const open = invoices.filter(i => i.status !== 'paid');
            const paid = invoices.filter(i => i.status === 'paid');
            const toPay = open.reduce((s, i) => s + (i.total || 0), 0);
            const row = i => `
                <button class="inv ${i.status === 'paid' ? 'paid' : ''}" data-id="${esc(i.id)}">
                    <span class="grow">
                        <span class="inv-number">${docTitle(i)} ${esc(i.number)}</span><br>
                        <span class="inv-sub">${esc(period(i.items))} · ${pocet((i.items || []).length)}</span><br>
                        <span class="inv-status">${i.status === 'paid' ? 'Zaplaceno ' + (i.paidAt ? new Date(i.paidAt).toLocaleDateString('cs-CZ') : '') : 'Splatnost ' + d(i.dueDate)}</span>
                    </span>
                    <span class="inv-total">${kc(i.total)}</span>
                </button>`;
            body.innerHTML = `
                <div class="summary">
                    <div class="summary-label">K proplacení</div>
                    <div class="summary-value">${kc(toPay)}</div>
                    <div class="summary-sub">${open.length ? open.length + (open.length === 1 ? ' faktura' : (open.length <= 4 ? ' faktury' : ' faktur')) : 'Všechno je zaplacené'}</div>
                </div>
                ${open.length ? '<div class="section-title">Čeká na proplacení <span class="section-count">' + open.length + '</span></div>' + open.map(row).join('') : ''}
                ${paid.length ? '<div class="section-title">Zaplacené <span class="section-count">' + paid.length + '</span></div>' + paid.map(row).join('') : ''}`;
        }

        function renderDetail(inv) {
            document.getElementById('listView').style.display = 'none';
            document.getElementById('detailView').style.display = '';
            const title = docTitle(inv);
            document.title = title + ' ' + inv.number;
            const vs = String(inv.number || '').replace(/\D/g, '');
            const s = inv.supplier || {}, c = inv.customer || {};
            const iban = toIBAN(s.account);
            const qr = qrSvg(inv, vs);
            document.getElementById('doc').innerHTML = `
                <div class="doc-head">
                    <div class="doc-title">${title.toUpperCase()}</div>
                    <div class="doc-number"><span>číslo</span>${esc(inv.number)}</div>
                </div>
                <div class="parties">
                    <div>
                        <div class="party-label">Dodavatel</div>
                        <div class="party-name">${esc(s.name)}</div>
                        ${s.address ? '<div class="party-line">' + esc(s.address) + '</div>' : ''}
                        ${s.ico ? '<div>IČO: ' + esc(s.ico) + '</div>' : ''}
                        ${inv.vatNote ? '<div>Nejsem plátce DPH.</div>' : ''}
                        ${inv.tradeNote ? '<div>Fyzická osoba zapsaná v živnostenském rejstříku.</div>' : ''}
                    </div>
                    <div>
                        <div class="party-label">Odběratel</div>
                        <div class="party-name">${esc(c.name)}</div>
                        ${c.address ? '<div class="party-line">' + esc(c.address) + '</div>' : ''}
                        ${c.ico ? '<div>IČO: ' + esc(c.ico) + '</div>' : ''}
                        ${c.dic ? '<div>DIČ: ' + esc(c.dic) + '</div>' : ''}
                    </div>
                </div>
                <div class="facts">
                    <div><div class="fact-label">Datum vystavení</div><div class="fact-value">${d(inv.issueDate)}</div></div>
                    <div><div class="fact-label">Datum splatnosti</div><div class="fact-value">${d(inv.dueDate)}</div></div>
                    <div><div class="fact-label">Období</div><div class="fact-value">${esc(period(inv.items))}</div></div>
                    <div><div class="fact-label">Způsob platby</div><div class="fact-value">Převodem</div></div>
                    <div><div class="fact-label">Číslo účtu</div><div class="fact-value">${esc(s.account)}</div></div>
                    <div><div class="fact-label">Variabilní symbol</div><div class="fact-value">${esc(vs)}</div></div>
                </div>
                <table>
                    <thead><tr><th>Datum</th><th>Popis</th><th class="num hide-sm">Doba</th><th class="num">Částka</th></tr></thead>
                    <tbody>
                        ${(inv.items || []).map(i => `
                            <tr>
                                <td>${d(i.date)}</td>
                                <td>Úklid – ${esc(i.address)}</td>
                                <td class="num hide-sm">${esc(duration(i.duration))}</td>
                                <td class="num">${kc2(i.price)}</td>
                            </tr>`).join('')}
                    </tbody>
                </table>
                <div class="totals">
                    ${qr ? '<div class="qr">' + qr + 'QR Platba</div>' : ''}
                    <div class="grand">
                        <div class="grand-label">Celkem k úhradě</div>
                        <div class="grand-value">${kc2(inv.total)}</div>
                    </div>
                </div>
                <div class="doc-foot">${iban ? 'IBAN: ' + esc(iban) : ''}</div>`;
            const paid = inv.status === 'paid';
            const banner = document.getElementById('paidBanner');
            banner.style.display = paid ? '' : 'none';
            banner.textContent = paid ? 'Zaplaceno' + (inv.paidAt ? ' ' + new Date(inv.paidAt).toLocaleDateString('cs-CZ') : '') : '';
            const btn = document.getElementById('btnPaid');
            btn.textContent = paid ? 'Vrátit na nezaplacené' : 'Označit jako zaplacené';
            btn.classList.toggle('btn-primary', !paid);
            btn.dataset.id = inv.id;
            window.scrollTo(0, 0);
        }

        function route() {
            const f = params().f;
            const inv = f && invoices.find(i => i.id === f);
            if (inv) renderDetail(inv); else renderList();
        }

        document.getElementById('listBody').addEventListener('click', e => {
            const b = e.target.closest('.inv');
            if (b) location.hash = 'k=' + encodeURIComponent(key) + '&f=' + encodeURIComponent(b.dataset.id);
        });

        document.getElementById('btnBack').addEventListener('click', () => {
            location.hash = 'k=' + encodeURIComponent(key);
        });

        document.getElementById('btnPrint').addEventListener('click', () => window.print());

        document.getElementById('btnPaid').addEventListener('click', async function() {
            const inv = invoices.find(i => i.id === this.dataset.id);
            if (!inv) return;
            const toPaid = inv.status !== 'paid';
            if (!confirm(toPaid ? 'Označit fakturu ' + inv.number + ' (' + kc(inv.total) + ') jako zaplacenou?' : 'Vrátit fakturu ' + inv.number + ' mezi nezaplacené?')) return;
            this.disabled = true;
            const patch = toPaid ? {status: 'paid', paidAt: new Date().toISOString()} : {status: 'open', paidAt: null};
            try {
                await db('PATCH', 'faktury/' + encodeURIComponent(key) + '/' + encodeURIComponent(inv.id), patch);
                inv.status = patch.status;
                inv.paidAt = patch.paidAt;
                renderDetail(inv);
            } catch (e) {
                alert('Nepodařilo se uložit. Zkontroluj připojení a zkus to znovu.');
            } finally {
                this.disabled = false;
            }
        });

        window.addEventListener('hashchange', () => {
            if (params().k !== key) load(); else route();
        });

        load();
    </script>
</body>
</html>
